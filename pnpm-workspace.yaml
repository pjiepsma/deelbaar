packages:
  - "apps/*"

# Hoisted layout avoids Windows CMAKE_OBJECT_PATH_MAX failures (react-native-worklets / NDK).
nodeLinker: hoisted

# Private monorepo: RN/native deps (Skia, sharp, esbuild, …) need install scripts.
# Per-package allowBuilds lists rot — one switch for all dependency build scripts.
dangerouslyAllowAllBuilds: true
