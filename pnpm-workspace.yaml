packages:
  - "apps/*"

# Hoisted layout avoids Windows CMAKE_OBJECT_PATH_MAX failures (react-native-worklets / NDK).
nodeLinker: hoisted

allowBuilds:
  "@heroui-pro/react": true
  "@sentry/cli": true
  "@shopify/react-native-skia": true
  "@zowe/secrets-for-zowe-sdk": false
  esbuild: true
  heroui-native-pro: true
  heroui-pro: true
  sharp: true
  unrs-resolver: true
