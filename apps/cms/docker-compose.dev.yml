version: '3.8'

# Development docker-compose (for local dev with hot reload)
services:
  payload:
    image: node:22.17.0-alpine
    container_name: deelbaar-payload-dev
    ports:
      - '4000:4000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - SELECTED_CONFIG=${SELECTED_CONFIG:-default}
      - DATABASE_URI=postgresql://postgres:postgres@postgres:5432/payload
    networks:
      - deelbaar-network

  postgres:
    image: postgis/postgis:16-3.4
    container_name: deelbaar-postgres-dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_DB=payload
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payload']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deelbaar-network
    logging:
      driver: none

volumes:
  postgres_dev_data:
    driver: local
  node_modules:

networks:
  deelbaar-network:
    driver: bridge

