version: '3.8'

services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SENTRY_ORG=${SENTRY_ORG:-}
        - SENTRY_PROJECT=${SENTRY_PROJECT:-}
        - SENTRY_DSN=${SENTRY_DSN:-}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - PAYLOAD_SECRET=${PAYLOAD_SECRET:-dummy-secret-for-build-only}
        - SELECTED_CONFIG=${SELECTED_CONFIG:-production}
    container_name: deelbaar-payload
    restart: unless-stopped
    ports:
      - '4000:4000'
    volumes:
      # Persistent media storage (uploads)
      - media_data:/app/media
    environment:
      - NODE_ENV=production
      - SELECTED_CONFIG=production
      - DATABASE_URI=postgresql://postgres:postgres@postgres:5432/payload
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:4000}
      - FRONTEND_URL=${FRONTEND_URL}
      - EXPO_URLS=${EXPO_URLS}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - SENTRY_ORG=${SENTRY_ORG}
      - SENTRY_PROJECT=${SENTRY_PROJECT}
    depends_on:
      postgres:
        condition: service_started
    networks:
      - deelbaar-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/admin']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgis/postgis:16-3.4
    container_name: deelbaar-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_DB=payload
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - deelbaar-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payload']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local

networks:
  deelbaar-network:
    driver: bridge

