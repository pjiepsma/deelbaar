version: '3'

services:
  payload:
    image: node:18-alpine
    ports:
      - '4000:4000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      - mongo
      # - postgres
    env_file:
      - .env
    environment:
      - SELECTED_CONFIG=${SELECTED_CONFIG:-default}
      - MONGODB_URI=mongodb://mongo:27017/payload

  # Use MONGODB_URI (QD-P style); DATABASE_URL / DATABASE_URI also supported by config.
  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none

  # Uncomment the following to use postgres
  # postgres:
  #   restart: always
  #   image: postgres:latest
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  data:
  # pgdata:
  node_modules:
